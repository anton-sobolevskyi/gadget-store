services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gadget_store
      POSTGRES_PASSWORD: gadget_store
      POSTGRES_DB: gadget_store
    ports:
      - "5432:5432"
    volumes:
      - gadget_store_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gadget_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gadget_store_postgres:
